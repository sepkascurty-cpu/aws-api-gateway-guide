<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff9900"/>
    </marker>
  </defs>

  <rect width="1100" height="520" fill="#f7f9fb" rx="12"/>

  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#232f3e">AWS API Gateway — Request Lifecycle</text>
  <text x="550" y="60" text-anchor="middle" font-size="13" fill="#5b6b7c">api.example.com → custom domain → authorizer → throttled route → backend</text>

  <!-- Client -->
  <rect x="30" y="180" width="150" height="110" rx="10" fill="#ffffff" stroke="#232f3e" stroke-width="2"/>
  <text x="105" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#232f3e">Client</text>
  <text x="105" y="236" text-anchor="middle" font-size="12" fill="#5b6b7c">web / mobile /</text>
  <text x="105" y="252" text-anchor="middle" font-size="12" fill="#5b6b7c">partner apps</text>
  <text x="105" y="272" text-anchor="middle" font-size="11" fill="#8795a1">HTTPS + token</text>

  <!-- Route 53 / custom domain -->
  <rect x="230" y="180" width="150" height="110" rx="10" fill="#ffffff" stroke="#ff9900" stroke-width="2"/>
  <text x="305" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#232f3e">Route 53</text>
  <text x="305" y="236" text-anchor="middle" font-size="12" fill="#5b6b7c">api.example.com</text>
  <text x="305" y="252" text-anchor="middle" font-size="12" fill="#5b6b7c">alias → regional</text>
  <text x="305" y="272" text-anchor="middle" font-size="11" fill="#8795a1">TLS terminates</text>

  <!-- API Gateway -->
  <rect x="430" y="130" width="220" height="210" rx="10" fill="#fff7e6" stroke="#ff9900" stroke-width="2.5"/>
  <text x="540" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#232f3e">API Gateway</text>
  <text x="540" y="178" text-anchor="middle" font-size="12" fill="#5b6b7c">HTTP API · $default stage</text>

  <rect x="445" y="192" width="190" height="52" rx="8" fill="#ffffff" stroke="#d5dbdb" stroke-width="1.5"/>
  <text x="540" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#232f3e">Authorizer</text>
  <text x="540" y="230" text-anchor="middle" font-size="11" fill="#5b6b7c">Lambda / JWT · cached TTL</text>

  <rect x="445" y="254" width="190" height="52" rx="8" fill="#ffffff" stroke="#d5dbdb" stroke-width="1.5"/>
  <text x="540" y="274" text-anchor="middle" font-size="13" font-weight="600" fill="#232f3e">Throttling</text>
  <text x="540" y="292" text-anchor="middle" font-size="11" fill="#5b6b7c">rate + burst per route</text>

  <!-- Backends -->
  <rect x="700" y="110" width="170" height="76" rx="10" fill="#ffffff" stroke="#7b42bc" stroke-width="2"/>
  <text x="785" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#232f3e">λ Orders API</text>
  <text x="785" y="158" text-anchor="middle" font-size="11" fill="#5b6b7c">POST /orders</text>
  <text x="785" y="174" text-anchor="middle" font-size="11" fill="#8795a1">business logic</text>

  <rect x="700" y="206" width="170" height="76" rx="10" fill="#ffffff" stroke="#7b42bc" stroke-width="2"/>
  <text x="785" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#232f3e">SQS direct</text>
  <text x="785" y="254" text-anchor="middle" font-size="11" fill="#5b6b7c">POST /events</text>
  <text x="785" y="270" text-anchor="middle" font-size="11" fill="#8795a1">no Lambda hop</text>

  <rect x="700" y="302" width="170" height="76" rx="10" fill="#ffffff" stroke="#7b42bc" stroke-width="2"/>
  <text x="785" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#232f3e">HTTP service</text>
  <text x="785" y="350" text-anchor="middle" font-size="11" fill="#5b6b7c">GET /catalog</text>
  <text x="785" y="366" text-anchor="middle" font-size="11" fill="#8795a1">ECS / legacy</text>

  <!-- Observability -->
  <rect x="920" y="180" width="150" height="110" rx="10" fill="#ffffff" stroke="#1a9e6f" stroke-width="2"/>
  <text x="995" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#232f3e">Observability</text>
  <text x="995" y="236" text-anchor="middle" font-size="12" fill="#5b6b7c">CloudWatch logs</text>
  <text x="995" y="252" text-anchor="middle" font-size="12" fill="#5b6b7c">(JSON access logs)</text>
  <text x="995" y="272" text-anchor="middle" font-size="11" fill="#8795a1">X-Ray tracing</text>

  <!-- Arrows -->
  <line x1="180" y1="235" x2="224" y2="235" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="235" x2="424" y2="235" stroke="#ff9900" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="402" y="222" text-anchor="middle" font-size="11" fill="#ff9900" font-weight="600">1</text>

  <line x1="650" y1="148" x2="694" y2="148" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="672" y="138" text-anchor="middle" font-size="11" fill="#5b6b7c" font-weight="600">2</text>
  <line x1="650" y1="244" x2="694" y2="244" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="672" y="234" text-anchor="middle" font-size="11" fill="#5b6b7c" font-weight="600">3</text>
  <line x1="650" y1="340" x2="694" y2="340" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="672" y="330" text-anchor="middle" font-size="11" fill="#5b6b7c" font-weight="600">4</text>

  <line x1="785" y1="186" x2="995" y2="186" stroke="#1a9e6f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="920" y1="196" x2="880" y2="196" stroke="#1a9e6f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="940" y="186" text-anchor="middle" font-size="11" fill="#1a9e6f">logs + traces</text>

  <!-- Deny path -->
  <line x1="470" y1="192" x2="470" y2="120" stroke="#d13239" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="470" y1="120" x2="180" y2="120" stroke="#d13239" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="320" y="112" text-anchor="middle" font-size="12" fill="#d13239" font-weight="600">deny → 401 / 403 (never reaches backend)</text>

  <!-- Legend / notes -->
  <rect x="30" y="400" width="1040" height="90" rx="10" fill="#ffffff" stroke="#d5dbdb" stroke-width="1.5"/>
  <text x="50" y="428" font-size="13" font-weight="700" fill="#232f3e">Reading the flow</text>
  <text x="50" y="450" font-size="12" fill="#5b6b7c">1 · TLS terminates at the gateway — backends never see raw internet traffic.</text>
  <text x="50" y="468" font-size="12" fill="#5b6b7c">2 · The authorizer runs before any backend code; a deny short-circuits with 401/403.</text>
  <text x="560" y="450" font-size="12" fill="#5b6b7c">3 · Per-route throttling protects expensive integrations from retry storms.</text>
  <text x="560" y="468" font-size="12" fill="#5b6b7c">4 · JSON access logs + X-Ray make every 5xx one query away from its cause.</text>
</svg>
